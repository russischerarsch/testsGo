name: Regression

on:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Unit tests
        run: go test -v -short ./...

      - name: Integration tests
        run: go test -v -tags=integration ./...

      - name: E2E tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: go test -v -tags=e2e ./e2e/...
